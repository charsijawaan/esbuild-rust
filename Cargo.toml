[package]
name = "esbuild-rs"
version = "0.0.1"
edition = "2024"
rust-version = "1.96"
description = "A source-faithful Rust port of esbuild"
license = "MIT"
repository = "https://github.com/charsijawaan/esbuild-rust"
publish = false

[lib]
name = "esbuild_rs"
path = "src/lib.rs"

[[bin]]
name = "esbuild"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
regex = "1.13.1"
url = "2.5.8"
zip = { version = "=8.4.0", default-features = false, features = ["deflate"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
